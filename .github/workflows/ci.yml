name: CI

# Har push va PR'da build + test (faqat kod tegishli yo'llarda)
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET 8 SDK o'rnatish
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: NuGet keshi
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore TypingWar.sln

      - name: Build (Release)
        run: dotnet build TypingWar.sln -c Release --no-restore

      - name: Test
        run: dotnet test TypingWar.sln -c Release --no-build --verbosity normal
