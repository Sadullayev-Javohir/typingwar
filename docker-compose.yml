services:
  postgres:
    image: postgres:16
    container_name: typingwar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: typingwar
      POSTGRES_USER: typingwar
      POSTGRES_PASSWORD: typingwar_dev
    ports:
      # Mahalliy PostgreSQL xizmatlari bilan port to'qnashmasligi uchun 5434 ishlatiladi.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typingwar -d typingwar"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: typingwar-redis
    restart: unless-stopped
    ports:
      - "6380:6379"   # Mahalliy Redis xizmati bilan port to'qnashmasligi uchun.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
