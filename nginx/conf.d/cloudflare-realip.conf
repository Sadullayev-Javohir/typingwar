# ── Cloudflare real-IP (haqiqiy mijoz IP'sini tiklash) ────────
#
# Cloudflare orqasida barcha so'rovlar Cloudflare IP'laridan keladi. Bu faylsiz
# nginx (limit_req) va ilova (rate limit / brute-force qulflash) HAMMANI bitta IP
# (Cloudflare) deb ko'rardi → himoyalar ishlamasdi.
#
# Quyidagi `set_real_ip_from` — faqat shu (Cloudflare) IP'lardan kelgan so'rovlarda
# CF-Connecting-IP sarlavhasidagi haqiqiy mijoz IP'siga ishonadi. Boshqa (to'g'ridan-
# to'g'ri) manbalardan kelgan soxta CF-Connecting-IP E'TIBORSIZ qoldiriladi.
#
# ⚠️ Cloudflare ULANMAGAN bo'lsa ham bu fayl XAVFSIZ — trafik Cloudflare IP'sidan
#    kelmaguncha hech narsa o'zgartirmaydi. Shuning uchun oldindan qo'yib qo'ysa bo'ladi.
#
# Manba (yangilab turing):  https://www.cloudflare.com/ips/
# (IP oralig'i o'zgarsa shu ro'yxatni yangilang)

# ── Cloudflare IPv4 ──
set_real_ip_from 173.245.48.0/20;
