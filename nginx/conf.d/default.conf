# ── TypingWar nginx — 1-BOSQICH: faqat HTTP ───────────────────
# DNS hali yo'q. http://89.167.74.156 orqali ishlaydi.
# SSL ulagandan keyin bu faylni nginx/ssl.conf bilan almashtiring (DEPLOY.md ga qarang).

# SignalR (WebSocket) uchun Upgrade sarlavhasi
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 10m;

    # Let's Encrypt ACME tekshiruvi uchun (SSL bosqichida kerak bo'ladi)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;

        # WebSocket (SignalR hublari: /hubs/race, /hubs/lobby, ...)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Haqiqiy IP + sxema (ForwardedHeaders / rate limiting uchun)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;   # uzoq SignalR ulanishlari uchun
        proxy_send_timeout  3600s;
    }
}
