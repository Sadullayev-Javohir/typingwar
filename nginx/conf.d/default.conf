# ── TypingWar nginx — 1-BOSQICH: faqat HTTP ───────────────────
# DNS hali yo'q. http://89.167.74.156 orqali ishlaydi.
# SSL ulagandan keyin bu faylni nginx/ssl.conf bilan almashtiring (DEPLOY.md ga qarang).

# SignalR (WebSocket) uchun Upgrade sarlavhasi
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── DDoS / brute-force himoyasi (chekka qatlam) ───────────────
# Har bir IP uchun so'rov tezligi cheklovi. binary_remote_addr — haqiqiy
# mijoz IP (proxy emas, chunki bu birinchi kirish nuqtasi).
limit_req_zone  $binary_remote_addr  zone=general:10m  rate=30r/s;   # umumiy trafik
limit_req_zone  $binary_remote_addr  zone=auth:10m     rate=20r/m;   # kirish/OAuth (sekin)
limit_conn_zone $binary_remote_addr  zone=perip:10m;                 # bir IP dan ulanishlar soni

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ── Axborot tarqalishi himoyasi ──
    server_tokens off;                  # nginx versiyasini yashirish

    # ── Slowloris / sekin-so'rov hujumlari himoyasi ──
    client_max_body_size      2m;       # yuklash yo'q — kichik tana yetarli
    client_body_timeout       15s;      # tanani sekin yuborish bloklanadi
    client_header_timeout     15s;      # sarlavhani sekin yuborish bloklanadi
    send_timeout              30s;
    large_client_header_buffers 4 8k;   # haddan tashqari katta sarlavha rad etiladi

    # Bir IP dan bir vaqtda maksimal ulanishlar (ulanish floodi himoyasi).
    # SignalR + bir nechta tab uchun yetarlicha keng.
    limit_conn perip 40;
    limit_req_status 429;
    limit_conn_status 429;

    # Let's Encrypt ACME tekshiruvi uchun (SSL bosqichida kerak bo'ladi)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── SignalR hublari (uzoq yashaydigan WebSocket) ──
    # So'rov-tezligi cheklovisiz (ulanish doimiy), faqat ulanishlar soni cheklangan.
    location /hubs/ {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;   # uzoq SignalR ulanishlari uchun
        proxy_send_timeout  3600s;
    }

    # ── Kirish / OAuth endpointlari (brute-force himoyasi — qattiqroq) ──
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Qolgan barcha trafik ──
    location / {
        limit_req zone=general burst=60 nodelay;

        proxy_pass         http://app:8080;
        proxy_http_version 1.1;

        # WebSocket sarlavhalari (fallback long-polling uchun ham)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Haqiqiy IP + sxema (ForwardedHeaders / rate limiting uchun)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
