# ── TypingWar nginx — 2-BOSQICH: HTTPS (SSL) ──────────────────
# DNS typingwar.uz -> 89.167.74.156 ulangach VA certbot sertifikat olgach ishlatiladi.
# O'rnatish:  nginx/conf.d/default.conf ni shu fayl bilan almashtiring (DEPLOY.md ga qarang).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── DDoS / brute-force himoyasi (chekka qatlam) ───────────────
limit_req_zone  $binary_remote_addr  zone=general:10m  rate=30r/s;
limit_req_zone  $binary_remote_addr  zone=auth:10m     rate=20r/m;
limit_conn_zone $binary_remote_addr  zone=perip:10m;

# HTTP -> HTTPS yo'naltirish + ACME tekshiruvi
server {
    listen 80;
    listen [::]:80;
    server_name typingwar.uz www.typingwar.uz;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name typingwar.uz www.typingwar.uz;

    # ── Axborot tarqalishi himoyasi ──
    server_tokens off;

    # ── Slowloris / sekin-so'rov hujumlari himoyasi ──
    client_max_body_size      2m;
    client_body_timeout       15s;
    client_header_timeout     15s;
    send_timeout              30s;
    large_client_header_buffers 4 8k;

    limit_conn perip 40;
    limit_req_status 429;
    limit_conn_status 429;

    ssl_certificate     /etc/letsencrypt/live/typingwar.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/typingwar.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS (xavfsiz ulanishni majburlaydi)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── SignalR hublari (uzoq yashaydigan WebSocket) ──
    location /hubs/ {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Kirish / OAuth endpointlari (brute-force himoyasi — qattiqroq) ──
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Qolgan barcha trafik ──
    location / {
        limit_req zone=general burst=60 nodelay;

        proxy_pass         http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
