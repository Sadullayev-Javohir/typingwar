# ── TypingWar nginx — Cloudflare ORIGIN sertifikati bilan HTTPS ──
#
# Bu konfiguratsiya Cloudflare orqasida ishlaydi (Full strict). Let's Encrypt
# o'rniga Cloudflare Origin Certificate ishlatiladi (15 yil amal qiladi, ACME yo'q).
#
# O'RNATISH (deploy/CLOUDFLARE.md ga qarang):
#   1. Cloudflare panel: SSL/TLS → Origin Server → Create Certificate
#   2. Sertifikat va kalitni serverga saqlang:
#        nginx/ssl/cloudflare-origin.pem   (Origin Certificate)
#        nginx/ssl/cloudflare-origin.key   (Private Key)
#   3. Bu faylni conf.d/default.conf o'rniga qo'ying (DEPLOY.md kabi) va nginx'ni qayta yuklang.
#
# Eslatma: cloudflare-realip.conf (conf.d/ da) avtomatik yuklanadi — haqiqiy mijoz IP'si
# CF-Connecting-IP dan tiklanadi (rate limiting / brute-force qulflash to'g'ri ishlaydi).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── DDoS / brute-force himoyasi (chekka qatlam) ───────────────
limit_req_zone  $binary_remote_addr  zone=general:10m  rate=30r/s;
limit_req_zone  $binary_remote_addr  zone=auth:10m     rate=20r/m;
limit_conn_zone $binary_remote_addr  zone=perip:10m;

# HTTP → HTTPS (Cloudflare 80 orqali ulansa)
server {
    listen 80;
    listen [::]:80;
    server_name typingwar.uz www.typingwar.uz;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name typingwar.uz www.typingwar.uz;

    # ── Axborot tarqalishi himoyasi ──
    server_tokens off;

    # ── Slowloris / sekin-so'rov himoyasi ──
    client_max_body_size      2m;
    client_body_timeout       15s;
    client_header_timeout     15s;
    send_timeout              30s;
    large_client_header_buffers 4 8k;

    limit_conn perip 40;
    limit_req_status 429;
    limit_conn_status 429;

    # ── Cloudflare Origin sertifikati ──
    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── (Ixtiyoriy, tavsiya etiladi) Authenticated Origin Pulls ──
    # Faqat Cloudflare origin'ga ulanа olsin (mTLS). Yoqish uchun:
    #   1. Cloudflare panel: SSL/TLS → Origin Server → Authenticated Origin Pulls = ON
    #   2. CF origin-pull CA ni yuklab oling va nginx/ssl/ ga saqlang:
    #      https://developers.cloudflare.com/ssl/origin-configuration/authenticated-origin-pull/
    #   3. Quyidagi 2 qatorni oching:
    # ssl_client_certificate /etc/nginx/ssl/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── SignalR hublari (WebSocket) ──
    location /hubs/ {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Kirish / OAuth (brute-force himoyasi — qattiqroq) ──
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Qolgan barcha trafik ──
    location / {
        limit_req zone=general burst=60 nodelay;

        proxy_pass         http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
